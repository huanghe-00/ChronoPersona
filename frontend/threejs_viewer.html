<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChronoPersona 3D HM3D Viewer</title>
<style>
  body { margin: 0; overflow: hidden; background: #111; color: #0ff; font-family: monospace; }
  #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 18px; pointer-events: none; }
  #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 4px; max-width: 320px; line-height: 1.6; }
  #canvas2d { position: absolute; bottom: 10px; right: 10px; width: 240px; height: 240px; border: 1px solid #0ff; background: rgba(0,0,0,0.7); border-radius: 4px; }
</style>
</head>
<body>
<div id="loading">Loading 3D Scene...</div>
<div id="info">Connecting to ws://localhost:8765/ws ...</div>
<canvas id="canvas2d" width="240" height="240"></canvas>
<div id="controls" style="position:absolute; bottom:10px; left:10px; background:rgba(0,0,0,0.6); padding:10px; border-radius:4px; color:#fff; font-family:monospace; z-index:100;">
  <input id="cmd" type="text" placeholder="输入指令，如：去沙发" style="width:180px; padding:4px; border:1px solid #0ff; background:#111; color:#0ff;" />
  <button id="sendBtn" style="padding:4px 8px; background:#0ff; color:#111; border:none; cursor:pointer;">发送</button>
  <div id="reply" style="margin-top:6px; font-size:12px; max-width:260px; word-break:break-all; line-height:1.5;"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// 空场景
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a20);
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(5, 8, 15);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// 灯光与网格
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
scene.add(new THREE.GridHelper(40, 40, 0x444444, 0x222222));

// Agent 蓝球
const agentGeo = new THREE.SphereGeometry(0.25, 16, 16);
const agentMat = new THREE.MeshBasicMaterial({ color: 0x3498db });
const agentMesh = new THREE.Mesh(agentGeo, agentMat);
scene.add(agentMesh);

// 目标标记组
const goalGeo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
const goalMat = new THREE.MeshBasicMaterial({ color: 0x2ecc71 });
const objectsGroup = new THREE.Group();
scene.add(objectsGroup);

let pathLine = null;
const pathMat = new THREE.LineBasicMaterial({ color: 0xe74c3c });

// 路径视觉残留：历史路径组
let pathHistory = [];
const pathHistoryGroup = new THREE.Group();
scene.add(pathHistoryGroup);

// 2D 小地图
const c2d = document.getElementById('canvas2d');
const ctx2d = c2d.getContext('2d');
const MAP_SIZE = 240, SCALE = 8, CENTER = MAP_SIZE / 2;

function drawMiniMap(state, sceneObjects) {
  ctx2d.clearRect(0, 0, MAP_SIZE, MAP_SIZE);
  ctx2d.fillStyle = 'rgba(0,0,0,0.8)'; ctx2d.fillRect(0, 0, MAP_SIZE, MAP_SIZE);
  ctx2d.strokeStyle = '#0ff'; ctx2d.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);
  if (sceneObjects) {
    Object.values(sceneObjects).forEach(o => {
      const px = CENTER + o.x * SCALE, py = CENTER + o.y * SCALE;
      ctx2d.fillStyle = '#2ecc71'; ctx2d.fillRect(px - 3, py - 3, 6, 6);
      ctx2d.fillStyle = '#fff'; ctx2d.font = '10px sans-serif';
      ctx2d.fillText(o.label, px + 4, py + 3);
    });
  }
  if (state) {
    const ax = CENTER + state.x * SCALE, ay = CENTER + state.y * SCALE;
    ctx2d.fillStyle = '#3498db'; ctx2d.beginPath(); ctx2d.arc(ax, ay, 5, 0, Math.PI * 2); ctx2d.fill();
    const theta = state.theta || 0;
    ctx2d.strokeStyle = '#e74c3c'; ctx2d.beginPath(); ctx2d.moveTo(ax, ay);
    ctx2d.lineTo(ax + Math.cos(theta) * 12, ay + Math.sin(theta) * 12); ctx2d.stroke();
  }
}

// WebSocket
const ws = new WebSocket('ws://localhost:8765/ws');
let currentState = null;
let currentObjects = {};
let lastUserInput = '';

function sendCmd() {
    const input = document.getElementById('cmd');
    const text = input.value.trim();
    if (!text) return;
    lastUserInput = text;
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ message: text, branch_id: 'main' }));
        document.getElementById('reply').innerHTML = '<span style="color:#0ff">→ ' + text + '</span>';
    } else {
        document.getElementById('reply').innerHTML = '<span style="color:#e74c3c">WebSocket 未连接</span>';
    }
    input.value = '';
}

ws.onopen = () => {
  document.getElementById('info').innerHTML = 'WebSocket Connected<br>Waiting for embodied.state...';
  document.getElementById('loading').style.display = 'none';
};
document.getElementById('cmd').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendCmd();
});
document.getElementById('sendBtn').addEventListener('click', sendCmd);
ws.onmessage = (event) => {
  const msg = JSON.parse(event.data);
  
  if (msg.event === 'chat.reply') {
    const d = msg.data;
    const reply = d.reply_text || '(no text)';
    const reasoning = d.action_plan && d.action_plan.reasoning ? d.action_plan.reasoning : '';
    let html = '<span style="color:#0ff">User: ' + lastUserInput + '</span>';
    html += '<br><span style="color:#2ecc71">Agent: ' + reply + '</span>';
    if (reasoning) {
      html += '<br><span style="color:#f1c40f; font-size:10px">[' + reasoning + ']</span>';
    }
    document.getElementById('reply').innerHTML = html;
    return;
  }
  
  if (msg.event !== 'embodied.state') return;
  const d = msg.data;
  currentState = d; currentObjects = d.scene_objects || {};

  // Info panel
  document.getElementById('info').innerHTML = `
    <b>Scene:</b> ${d.scene_id || 'N/A'}<br>
    <b>Backend:</b> ${d.backend_mode || 'N/A'}<br>
    <b>Pos:</b> (${d.x.toFixed(2)}, ${d.y.toFixed(2)}, ${d.z.toFixed(2)})<br>
    <b>FOV:</b> ${(d.fov_objects || []).join(', ') || 'none'}
  `;

  // 3D Agent: x=x, y=height(z), z=depth(y)
  agentMesh.position.set(d.x, d.z, d.y);

  // 目标标记（高度与 z 成正比，障碍物渲染为圆柱）
  while (objectsGroup.children.length > 0) objectsGroup.remove(objectsGroup.children[0]);
  Object.values(currentObjects).forEach(o => {
    if (o.type === 'obstacle') {
      const color = o.color ? parseInt(o.color.replace('#', '0x')) : 0xe74c3c;
      if (o.shape === 'box' && o.size) {
        const [sx, sy, sz] = o.size;
        const geo = new THREE.BoxGeometry(sx, sy, sz);
        const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.5 });
        const mesh = new THREE.Mesh(geo, mat);
        // 底部贴地: y = sy/2
        mesh.position.set(o.x, sy / 2, o.y);
        objectsGroup.add(mesh);
        // 轮廓线框增强 3D 结构感
        const edges = new THREE.EdgesGeometry(geo);
        const lineMat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.8 });
        const line = new THREE.LineSegments(edges, lineMat);
        line.position.copy(mesh.position);
        objectsGroup.add(line);
      } else if (o.shape === 'cylinder') {
        const r = o.radius || 0.5;
        const h = o.height || 1.0;
        const geo = new THREE.CylinderGeometry(r, r, h, 16);
        const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.5 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(o.x, h / 2, o.y);
        objectsGroup.add(mesh);
      } else {
        // 默认回退：圆柱
        const geo = new THREE.CylinderGeometry(1.0, 1.0, 1.0, 16);
        const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.4 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(o.x, 0.5, o.y);
        objectsGroup.add(mesh);
      }
    } else {
      // 普通物品：高度与 z 值成正比的方块
      const h = Math.max(0.3, (o.z || 0) * 0.8 + 0.2);
      const geo = new THREE.BoxGeometry(0.4, h, 0.4);
      const mesh = new THREE.Mesh(geo, goalMat);
      mesh.position.set(o.x, (o.z || 0) / 2, o.y);
      objectsGroup.add(mesh);
      // 底座标记（确保物品看起来是放在地面上）
      if (o.z > 0) {
        const baseGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.05, 8);
        const baseMat = new THREE.MeshBasicMaterial({ color: 0x555555 });
        const base = new THREE.Mesh(baseGeo, baseMat);
        base.position.set(o.x, 0.025, o.y);
        objectsGroup.add(base);
      }
    }
  });

  // 路径历史累积（从后端状态同步）
  if (d.metadata && Array.isArray(d.metadata.path_history)) {
    pathHistory = d.metadata.path_history;
  }

  // 渲染历史路径视觉残留（渐淡红色）
  while (pathHistoryGroup.children.length > 0) {
    const child = pathHistoryGroup.children[0];
    if (child.geometry) child.geometry.dispose();
    pathHistoryGroup.remove(child);
  }
  pathHistory.forEach((path, idx) => {
    if (!Array.isArray(path) || path.length < 2) return;
    const points = path.map(p => new THREE.Vector3(p[0], p[1], p[2]));
    const geom = new THREE.BufferGeometry().setFromPoints(points);
    // 旧路径逐渐淡化：越旧越透明，最新历史路径 opacity 0.35
    const opacity = Math.max(0.08, 0.35 - (pathHistory.length - idx - 1) * 0.03);
    const histMat = new THREE.LineBasicMaterial({
      color: 0xcc5555,
      transparent: true,
      opacity: opacity,
    });
    const line = new THREE.Line(geom, histMat);
    pathHistoryGroup.add(line);
  });

  // 当前活跃路径（高亮红色，短暂存在，移动结束后消失）
  if (d.metadata && Array.isArray(d.metadata.path_3d) && d.metadata.path_3d.length > 0) {
    const points = d.metadata.path_3d.map(p => new THREE.Vector3(p[0], p[1], p[2]));
    const geom = new THREE.BufferGeometry().setFromPoints(points);
    if (pathLine) { scene.remove(pathLine); pathLine.geometry.dispose(); }
    pathLine = new THREE.Line(geom, pathMat);
    scene.add(pathLine);
  } else if (!d.metadata || !d.metadata.path_3d || d.metadata.path_3d.length === 0) {
    // 当前无活跃路径时，移除高亮线
    if (pathLine) {
      scene.remove(pathLine);
      pathLine.geometry.dispose();
      pathLine = null;
    }
  }

  drawMiniMap(d, currentObjects);
};

ws.onclose = () => {
  document.getElementById('info').innerHTML += '<br><span style="color:#e74c3c">WS Disconnected</span>';
};

function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
animate();
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
