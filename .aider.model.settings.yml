# ============================================
# [新配置] Kimi K2.6 + GLM-5.1 架构
# 环境变量：
#   export KIMI_API_KEY=sk-kimi-xxx
#   export GLM_API_KEY=sk-xxx
# ============================================

# 架构师：Kimi K2.6
# 职责：需求拆解、代码库全局分析、跨文件修改方案设计、复杂重构规划
# 优势：262K 上下文、多步推理链保持、输入成本比 GLM 低约 48%
# 注意：editor_model_name 指向 GLM-5.1，由 GLM 执行实际文件编辑
- name: openai/kimi-for-coding
  edit_format: architect
  weak_model_name: openai/GLM-5.1
  use_repo_map: true
  editor_model_name: openai/GLM-5.1
  editor_edit_format: editor-diff
  extra_params:
    api_key:  # 使用KIMI+GLM时不可以留空， 手工添加key，aider 自动处理 Kimi key（或依赖 KIMI_API_KEY 环境变量）
    api_base: https://api.kimi.com/coding/v1
    extra_headers:
      User-Agent: KimiCLI/1.3

# 编辑师：GLM-5.1（正式模型名，区分大小写）
# 职责：精确执行 Architect 的 edit block、生成规范代码、单文件修改
# 优势：代码 cleanliness 评分高、结构化输出稳定、工具调用可靠
# 适用：常规重构、接口实现、格式化输出、标准 diff 应用
# 提示：GLM-5.1 原生 Agentic 工程能力优秀，无需额外 thinking 参数
# 关键修复：删除 api_key 字段，依赖 OPENAI_API_KEY 环境变量
#           因为 ${VAR} 语法在 aider YAML 中不被解析，会被当作字符串传递
- name: openai/GLM-5.1
  edit_format: diff
  weak_model_name: openai/GLM-5.1
  use_repo_map: true
  extra_params:
    api_base: http://113.46.219.251:8080/v1
    # 删除 api_key 行，由 OPENAI_API_KEY 环境变量提供